<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Resume Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #F5F3FF;
        }

        .auth-card {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            color: #202344;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            margin-bottom: 18px;
        }

        .auth-btn {
            width: 100%;
            background: #6C63FF;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        .auth-btn:hover {
            background: #5148e5;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="auth-card">

            <h2 class="text-center mb-2">Create Account</h2>

            <p class="text-center text-muted mb-4">
                Join AI Resume Analyzer
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <label>Full Name</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter your full name"
                       required>

                <label>Email Address</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

                <label>Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Minimum 8 characters"
                       minlength="8"
                       required>

                <label>Confirm Password</label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm your password"
                       minlength="8"
                       required>

                <button type="submit" class="auth-btn">
                    Register
                </button>

            </form>

            <p class="text-center mt-4">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Login</a>
            </p>

            <p class="text-center">
                <a href="/">Back to Home</a>
            </p>

        </div>

    </div>

</body>
</html>
